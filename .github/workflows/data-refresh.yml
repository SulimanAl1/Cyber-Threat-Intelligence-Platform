name: "A - Ingestion Data Refresh Pipeline"

on:
  schedule:
    # Run every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-threat-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Ingestion Dependencies
        run: npm ci

      - name: Run Threat Intelligence Pipeline
        run: npx tsx scripts/pipeline.ts
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Run Schema Validation Quality Gate
        # Scheduled data refreshes execute strict schema validation ONLY (not full test suite)
        run: npm run pipeline:validate

      - name: Commit and Push Updated Snapshots to Data Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Ensure data branch exists or switch to it
          if git show-ref --quiet refs/heads/data; then
            git checkout data
          else
            git checkout -b data
          fi
          
          # Copy updated snapshots from public/data to repo data branch
          mkdir -p data
          cp public/data/*.json data/
          
          git add data/*.json public/data/*.json
          if git diff-index --quiet HEAD --; then
            echo "No data changes detected. Snapshots are up-to-date."
          else
            git commit -m "chore(data): automated threat intel snapshot refresh [skip ci]"
            git push origin data
          fi
